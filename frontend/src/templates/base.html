{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Portal
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'portal/style.css' %}"
    >
</head>

<body>

<header class="header">

    <a
        class="header-brand"
        href="{% url 'portal:home' %}"
    >
        Portal
    </a>

    {% if user.is_authenticated %}

        <div class="header-user">

            <span>
                {{ user.username }}
            </span>

            <form
                method="post"
                action="{% url 'logout' %}"
            >
                {% csrf_token %}

                <button type="submit">
                    Logout
                </button>
            </form>

        </div>

    {% endif %}

</header>

<main class="main">

    {% block content %}
    {% endblock %}

</main>

</body>

</html>
