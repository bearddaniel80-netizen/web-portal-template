version: 1

metadata:
  name: Django RBAC Portal
  labels:
    blueprints.goauthentik.io/description: "OIDC provider for the Django RBAC portal"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: django-portal-provider
    identifiers:
      name: Django RBAC Portal Provider
    state: present
    attrs:
      name: Django RBAC Portal Provider
      client_type: confidential
      client_id: !Env OIDC_RP_CLIENT_ID
      client_secret: !Env OIDC_RP_CLIENT_SECRET

      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]

      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s/oidc/callback/", !Env DOMAIN]

      access_code_validity: minutes=5
      access_token_validity: minutes=10

  - model: authentik_core.application
    id: django-portal-application
    identifiers:
      slug: django-portal
    state: present
    attrs:
      name: Django RBAC Portal
      slug: django-portal
      provider: !KeyOf django-portal-provider
      policy_engine_mode: any

  - model: authentik_core.user
    identifiers:
      username: user1@example.com
    state: present
    attrs:
      name: User One
      email: user1@example.com
      is_active: true
      path: users
      password: !Env USER1_PASSWORD

  - model: authentik_core.user
    identifiers:
      username: user2@example.com
    state: present
    attrs:
      name: User Two
      email: user2@example.com
      is_active: true
      path: users
      password: !Env USER2_PASSWORD